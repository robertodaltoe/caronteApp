{% extends "base.html" %}
{% from '_icons.html' import icon %}
{% block title %}{{ 'Modifica voce catalogo' if voce else 'Nuova voce catalogo' }}{% endblock %}
{% block content %}

<h1 style="font-size:1.3rem; color:var(--blu);">
    {{ icon('list') }} {{ 'Modifica voce' if voce else 'Nuova voce' }}
</h1>
<p style="font-size:.78rem; color:var(--grigio); margin-bottom:16px;">
    <a href="{{ url_for('contrattazione.catalogo') }}">← Torna al catalogo</a>
</p>

<form method="post" class="card" style="max-width:640px; padding:20px;">
    <div class="form-group">
        <label>Numero di riferimento <span style="font-weight:400; color:var(--grigio); font-size:.78rem;">— facoltativo, come nel modello del Dirigente, es. "1", "28 bis": compare nella colonna "Rif." della lettera</span></label>
        <input type="text" name="numero_riferimento" value="{{ voce.numero_riferimento or '' if voce else '' }}" style="width:100%;">
    </div>
    <div class="form-group">
        <label>Nome dell'incarico *</label>
        <input type="text" name="nome" required value="{{ voce.nome if voce else '' }}" style="width:100%;">
    </div>
    <div class="form-group">
        <label>Testo descrittivo *</label>
        <textarea name="testo_riferimento" rows="10" required style="width:100%; box-sizing:border-box; font-family:inherit;">{{ voce.testo_riferimento if voce else '' }}</textarea>
    </div>
    <div class="form-group">
        <label style="display:flex; align-items:center; gap:6px;">
            <input type="checkbox" name="attivo" value="1" {% if not voce or voce.attivo %}checked{% endif %}>
            Attiva (selezionabile per le nuove assegnazioni)
        </label>
    </div>
    <button type="submit" class="btn btn-success">{{ icon('check') }} Salva</button>
</form>

{% endblock %}
