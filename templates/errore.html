{% extends "base.html" %}
{% from '_icons.html' import icon %}
{% block title %}{{ titolo }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px; margin:60px auto; text-align:center;">
    <div style="font-size:3rem; line-height:1;">{{ icona }}</div>
    <h1 style="margin:14px 0 6px;">{{ titolo }}</h1>
    <p style="color:var(--grigio);">{{ messaggio }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary" style="margin-top:12px;">
        {{ icon('home') }} Torna alla Dashboard
    </a>
</div>
{% endblock %}
