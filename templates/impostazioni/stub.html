{% extends "base.html" %}
{% block title %}{{ titolo }}{% endblock %}
{% block content %}
<div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
    <a href="{{ url_for('impostazioni.index') }}" class="btn btn-primary btn-sm">← Impostazioni</a>
    <h1 style="font-size:1.3rem; color:var(--blu);">{{ emoji }} {{ titolo }}</h1>
</div>
<div class="card" style="text-align:center; padding:40px; color:var(--grigio);">
    <div style="font-size:2.5rem; margin-bottom:12px;">🚧</div>
    <strong>{{ desc }}</strong>
</div>
{% endblock %}
