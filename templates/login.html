<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso — CaronteApp</title>
    <style>
        @font-face {
            font-family: 'Oswald Local'; font-weight: 700; font-style: normal; font-display: swap;
            src: url('{{ url_for('static', filename='fonts/oswald-700.woff2') }}') format('woff2');
        }
        @font-face {
            font-family: 'Plex Sans Local'; font-weight: 400; font-style: normal; font-display: swap;
            src: url('{{ url_for('static', filename='fonts/plexsans-400.woff2') }}') format('woff2');
        }
        @font-face {
            font-family: 'Plex Sans Local'; font-weight: 600; font-style: normal; font-display: swap;
            src: url('{{ url_for('static', filename='fonts/plexsans-600.woff2') }}') format('woff2');
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0a1f35 0%, #1a4a7a 100%);
            font-family: 'Plex Sans Local', 'Segoe UI', sans-serif;
        }
        .card {
            background: white; border-radius: 16px; padding: 40px;
            width: 100%; max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo h1 { font-family: 'Oswald Local', 'Segoe UI', sans-serif; font-size: 1.4rem; font-weight: 700; color: #0a1f35; }
        .logo p { font-size: .82rem; color: #6b7280; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: .82rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
        input {
            width: 100%; padding: 10px 14px; border: 1.5px solid #d1d5db;
            border-radius: 8px; font-size: .95rem; font-family: inherit;
            transition: border-color .12s;
        }
        input:focus { outline: none; border-color: #0a1f35; }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background: #0a1f35; color: white; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: background .12s; font-family: inherit;
        }
        .btn:hover { background: #1a4a7a; }
        .error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca;
                 border-radius: 8px; padding: 10px 14px; font-size: .85rem; margin-bottom: 16px; }
        .footer-link { text-align: center; margin-top: 20px; font-size: .75rem; color: #9ca3af; }
        .footer-link a { color: #6b7280; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>▤︎ CaronteApp</h1>
        <p>{{ nome_istituto }}</p>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   autofocus autocomplete="username"
                   placeholder="es. ds, dsga, segreteria">
        </div>
        <div class="form-group">
            <label for="pin">PIN</label>
            <input type="password" id="pin" name="pin"
                   autocomplete="current-password"
                   placeholder="••••">
        </div>
        <button class="btn" type="submit">Accedi</button>
    </form>

    <div class="footer-link">
        <a href="{{ url_for('auth.privacy') }}">Informativa privacy — GDPR</a>
    </div>
</div>
</body>
</html>
