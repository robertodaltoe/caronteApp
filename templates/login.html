<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso — CaronteApp</title>
    <!-- Senza questo link, il browser richiede da solo /favicon.ico (rotta
         inesistente in questa app) — vedi app.py::check_auth() per cosa
         succedeva prima di questo fix quando quella richiesta arrivava
         qui mentre la sessione di login era ancora in corso. -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/brand/favicon.png') }}">
    <style>
        @font-face {
            font-family: 'Oswald Local'; font-weight: 700; font-style: normal; font-display: swap;
            src: url('{{ url_for('static', filename='fonts/oswald-700.woff2') }}') format('woff2');
        }
        @font-face {
            font-family: 'Plex Sans Local'; font-weight: 400; font-style: normal; font-display: swap;
            src: url('{{ url_for('static', filename='fonts/plexsans-400.woff2') }}') format('woff2');
        }
        @font-face {
            font-family: 'Plex Sans Local'; font-weight: 600; font-style: normal; font-display: swap;
            src: url('{{ url_for('static', filename='fonts/plexsans-600.woff2') }}') format('woff2');
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        /* Stessa palette di base.html (--blu/--blu-med/--rosso/--rosso-bg/
           --grigio) ripetuta qui in chiaro: login.html è un documento a
           sé, non estende base.html, quindi non ha accesso alle sue
           variabili CSS. Prima era rimasto sul vecchio blu navy
           (#0a1f35/#1a4a7a), scollegato dal bordeaux del resto dell'app. */
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            /* Sfondo di riserva se per qualche motivo l'SVG sotto non
               caricasse — stesse tonalità, così non si nota la differenza. */
            background: linear-gradient(135deg, #43110d 0%, #7a1c17 100%);
            font-family: 'Plex Sans Local', 'Segoe UI', sans-serif;
            position: relative;
            overflow: hidden;
        }
        /* Sfondo low-poly: mesh triangolare generata proceduralmente nelle
           stesse tonalità del brand (dal bordeaux più scuro in alto al più
           acceso in basso), ispirata allo stile "sfaccettato" richiesto —
           originale, non un asset stock. */
        .bg-lowpoly {
            position: fixed; inset: 0; z-index: 0;
            width: 100%; height: 100%;
        }
        .bg-lowpoly svg { width: 100%; height: 100%; display: block; }
        .card {
            position: relative; z-index: 1;
            /* Leggermente trasparente: lascia intravedere la mesh low-poly
               dietro. backdrop-filter mantiene il testo leggibile sopra
               uno sfondo comunque mosso. */
            background: rgba(255,255,255,.88);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            border-radius: 16px; padding: 40px;
            width: 100%; max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }
        .logo {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin-bottom: 28px; text-align: left;
        }
        .logo img { height: 44px; width: 44px; object-fit: contain; flex-shrink: 0; }
        .logo h1 { font-family: 'Oswald Local', 'Segoe UI', sans-serif; font-size: 1.4rem; font-weight: 700; color: #7a1c17; }
        .logo p { font-size: .82rem; color: #6b7280; margin-top: 2px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: .82rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
        input {
            width: 100%; padding: 10px 14px; border: 1.5px solid #d1d5db;
            border-radius: 8px; font-size: .95rem; font-family: inherit;
            transition: border-color .12s;
        }
        input:focus { outline: none; border-color: #7a1c17; }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background: #7a1c17; color: white; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: background .12s; font-family: inherit;
        }
        .btn:hover { background: #a5241f; }
        .error { background: #fde8e8; color: #b91c1c; border: 1px solid #f3c2be;
                 border-radius: 8px; padding: 10px 14px; font-size: .85rem; margin-bottom: 16px; }
        /* login.html non estende base.html (documento a sé, vedi nota
           sopra), quindi non ha accesso al blocco che altrove renderizza
           get_flashed_messages() (templates/base.html) — un flash()
           messo in coda su un redirect verso /login (es. l'handler
           CSRFError in app.py) restava perciò invisibile: l'utente
           tornava su un form vuoto senza nessuna spiegazione, come se
           il login non facesse nulla. Stessi colori per categoria di
           base.html, ripetuti qui in chiaro come per il resto del file. */
        .flash { border-radius: 8px; padding: 10px 14px; font-size: .85rem;
                 margin-bottom: 16px; border-left: 4px solid; }
        .flash.warning { background: #fff8e1; color: #92400e; border-color: #e0a800; }
        .flash.danger, .flash.error { background: #fde8e8; color: #b91c1c; border-color: #b91c1c; }
        .flash.success { background: #e6f4ea; color: #1e7e34; border-color: #1e7e34; }
        .flash.info    { background: #e8f0fe; color: #1a4a7a; border-color: #1a4a7a; }
        .footer-link { text-align: center; margin-top: 20px; font-size: .75rem; color: #9ca3af; }
        .footer-link a { color: #6b7280; }
    </style>
</head>

<div class="card">
    <div class="logo">
        <img src="{{ url_for('static', filename='img/brand/caronte-icon.png') }}" alt="">
        <div>
            <h1>CaronteApp</h1>
            <p>{{ nome_istituto }}</p>
        </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
    {% endwith %}

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   autofocus autocomplete="username"
                   placeholder="es. ds, dsga, segreteria">
        </div>
        <div class="form-group">
            <label for="pin">PIN</label>
            <input type="password" id="pin" name="pin"
                   autocomplete="current-password"
                   placeholder="••••">
        </div>
        <button class="btn" type="submit">Accedi</button>
    </form>

    <div class="footer-link">
        <a href="{{ url_for('auth.privacy') }}">Informativa privacy — GDPR</a>
    </div>
</div>
</body>
</html>
